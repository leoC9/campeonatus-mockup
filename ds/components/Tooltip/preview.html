  h(E.Tooltip,{open:true},h(E.TooltipTrigger,{className:trigger},'OWR'),h(E.TooltipContent,null,'Taxa de vitória dos oponentes. Primeiro desempate.')),
  h(E.Tooltip,null,h(E.TooltipTrigger,{className:trigger},'OOWR'),h(E.TooltipContent,null,'Taxa de vitória dos oponentes dos oponentes. Segundo desempate.'))));
</script>
