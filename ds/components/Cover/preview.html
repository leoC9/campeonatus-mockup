<!-- @dsCard height=288 -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Eternatus Card House</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--cream); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .deep { fill:var(--navy-950); }
  .navy { fill:var(--navy-800); }
  .maroon { fill:var(--maroon); }
  .gold { fill:var(--gold); }
  .card { fill:var(--cream); }
  .xl { rx:var(--radius-xl); }
  .lg { rx:var(--radius-lg); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-size:72px; line-height:.95; font-weight:500; letter-spacing:-.02em; color:var(--ink); text-wrap:balance; }
  .tag { margin:var(--space-3) 0 0 2px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      navy-950 208×272 slab bled off the top (o hero, a cor mais conhecida) · navy-800 176×200 bleeding off the right (a sidebar) · maroon 112×120 (o líquido do frasco) · gold 112×64 (o acento do hero) — ≈40% of 960×288
  arrangement one tall slab with satellites, bottoms on one line space-5 above the edge, space-4 gutters
  pattern     literal motif — the fan of cards behind the flask in the logo: three card shapes (72×104, radius-lg) fanned −16°/0°/+16° on the slab, maroon · cream · gold
  scales      sides in space-2 multiples; gutters space-4; slab and right block radius-xl; cards and satellites radius-lg
-->
<rect class="deep xl" x="0" y="-16" width="208" height="280" rx="16"/>
<g transform="translate(104 212)">
  <rect class="maroon lg" x="-36" y="-120" width="72" height="104" rx="12" transform="rotate(-16 0 0)"/>
  <rect class="gold lg" x="-36" y="-120" width="72" height="104" rx="12" transform="rotate(16 0 0)"/>
  <rect class="card lg" x="-36" y="-128" width="72" height="104" rx="12"/>
</g>
<rect class="gold lg" x="224" y="64" width="112" height="64" rx="12"/>
<rect class="maroon lg" x="224" y="144" width="112" height="120" rx="12"/>
<rect class="navy xl" x="352" y="64" width="176" height="200" rx="16"/>
</svg>
</div>
<div class="words">
  <h1 class="name">Eternatus<br>Card House</h1>
  <p class="tag">Creme quente, azul-marinho de estrutura e o bordô do frasco.</p>
</div>
</div>
</body>
</html>
